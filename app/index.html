<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel = "icon" href = "favicon.svg" type="image/svg+xml">
<link rel = "icon" href = "favicon.ico" type="image/x-icon">
<title>Куайн–Мак-Класки</title>

<style>
:root {
    --bg-main: #0f1a17;
    --bg-card: rgba(20, 35, 32, 0.9);
    --bg-input: #162824;
    --accent: #3fa37a;
    --accent-hover: #4fc292;
    --text-main: #e6f2ee;
    --text-muted: #9fbfb3;
    --error: #ff6b6b;
    --terminal-bg: #0b1512;
    --terminal-text: #8cffc1;
    --radius: 14px;
}

* {
    box-sizing: border-box;
}


html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Inter", Arial, sans-serif;
    background: radial-gradient(circle at top, #162824, #0b1412 70%);
    color: var(--text-main);
    overflow: hidden;
}

.container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 1100px;
    width: 100%;
    margin: auto;
    background: var(--bg-card);
    border-radius: var(--radius);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(6px);
    overflow: hidden;
    padding: 10px 5px;
}

.content-wrapper {
    display: flex;
    flex-direction: column;
    flex: 1; 
    min-height: 0; 
    gap: 10px; 
}

.extended-view-buttons > button {
    width: 12%;
    padding: 5px 0px;
    font-size: 9px;
    font-weight: 600;
    border-radius: var(--radius);
    border: none;
    background: linear-gradient(135deg, var(--accent), #2f7f60);
    color: #072018;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
}

.extended-view-buttons {
    display: flex;
    flex-direction: row;
    justify-content: space-around;
}

h1 {
    text-align: center;
    margin: 0; 
    font-weight: 600;
    letter-spacing: 0.5px;
    font-size: 20px;
}

.subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 5px;
}

.input-group {
    display: flex;
    flex-direction: column;
}

label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
}

input[type="number"],
input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 12px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    background: var(--bg-input);
    color: var(--text-main);
    outline: none;
    transition: border 0.2s, box-shadow 0.2s;
}

input::placeholder {
    color: #6f8f85;
}

input:focus {
    border: 1px solid var(--accent);
    box-shadow: 0 0 0 2px rgba(63, 163, 122, 0.2);
}

.error {
    margin-top: 6px;
    font-size: 12px;
    color: var(--error);
}

.buttons {
    display: flex;
    flex-direction: row;
    justify-content: space-around;
}

.buttons > button {
    width: 40%;
    padding: 13px 0px;
    font-size: 12px;
    font-weight: 600;
    border-radius: var(--radius);
    border: none;
    background: linear-gradient(135deg, var(--accent), #2f7f60);
    color: #072018;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
}

button:hover {
    background: linear-gradient(135deg, var(--accent-hover), #3aa87f);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
}

button:active {
    transform: translateY(0);
    box-shadow: none;
}


#output {
    flex: 1; 
    min-height: 0; 
    width: 100%;
    padding: 14px;
    border-radius: var(--radius);
    background: var(--terminal-bg);
    color: var(--terminal-text);
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 11px;
    resize: none;
    overflow: auto;
    white-space: pre;
    border: none;
    outline: none;
    box-shadow: inset 0 0 0 1px rgba(140, 255, 193, 0.15);
}


/* Скроллбар */
#output::-webkit-scrollbar {
    width: 10px;
}
#output::-webkit-scrollbar-track {
    background: #0b1512;
    border-radius: 10px;
}
#output::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--accent), #2f7f60);
    border-radius: 10px;
    border: 2px solid #0b1512;
}
#output::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, var(--accent-hover), #3aa87f);
}
#output {
    scrollbar-width: thin;
    scrollbar-color: var(--accent) #0b1512;
}

input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

</style>
</head>

<body>
<div class = "container">
    <div class = "content-wrapper">

        <div class = "extended-view-buttons" style = "display: none">
            <button onclick = "changeFont(0)">A-</button>
            <button onclick = "changeFont(1)">A+</button>
            <button onclick = "changeColor()">Цвет</button>
            <button onclick = "closeExtendedView()">Закрыть</button>
        </div>

        <h1 class = "title mainView">Метод Куайна–Мак-Класки</h1>
        <div class = "subtitle mainView">Минимизация булевых функций <i>( powered by k1r1net )</i></div>

        <div class = "input-group mainView">
            <label for = "impLen">Число переменных</label>
            <input type = "number" id = "impLen" placeholder = "Например: 4">
            <div id = "impLenError" class = "error"></div>
        </div>

        <div class="input-group mainView">
            <label for = "arrayInput">Импликанты</label>
            <input type = "text" id = "arrayInput" 
            oninput = "this.value = this.value.replace(/[^0-2 ]/g,'')" placeholder="1010 1110 0111">
            <div id = "arrayError" class="error"></div>
        </div>

        <div class = "buttons mainView">
            <button onclick = "runAlgorithm()">Запустить алгоритм</button>
            <button onclick = "extendedView()">Расширенный вид</button>
        </div>

        <textarea id="output" readonly placeholder="Здесь появится результат..."></textarea>
    </div>
</div>

<script>
var Module = {
    print: (text) => {
        const out = document.getElementById('output');
        out.value += text + "\n";
        out.scrollTop = out.scrollHeight;
    }
};

function clearErrors() {
    impLenError.textContent = '';
    arrayError.textContent = '';
}

function clearOutput() {
    output.value = '';
}

function runAlgorithm() {
    clearErrors();
    clearOutput();

    const val = parseInt(impLen.value);
    const inputStr = arrayInput.value.trim();
    const arr = inputStr.split(/\s+/);
    let valid = true;

    if (isNaN(val) || val <= 0) {
        impLenError.textContent = 'Введите число больше нуля';
        valid = false;
    }

    if (!inputStr) {
        arrayError.textContent = 'Введите хотя бы одну импликанту';
        valid = false;
    } else {
        for (const item of arr) {
            if (!/^[0-2]+$/.test(item)) {
                arrayError.textContent = `Недопустимые символы в "${item}"`;
                valid = false;
                break;
            }
            if (item.length !== val) {
                arrayError.textContent = `"${item}" должно содержать ${val} символов`;
                valid = false;
                break;
            }
        }
    }

    if (!valid) return;

    const numArr = arr.map(Number);
    Module.ccall('setImpLen', null, ['number'], [val]);

    const ptr = Module._malloc(numArr.length * 4);
    Module.HEAP32.set(numArr, ptr >> 2);
    Module.ccall('setArray', null, ['number', 'number'], [ptr, numArr.length]);
    Module._free(ptr);

    Module.ccall('runAlgorithm', null, [], []);
}

function extendedView() {
    const elements = document.querySelectorAll(".mainView");
    elements.forEach(el => {
        el.style.display = 'none';
    })
    document.querySelector(".extended-view-buttons").style.display = 'flex';
}

function closeExtendedView() {
    const elements = document.querySelectorAll(".mainView");
    elements.forEach(el => {
        el.style.display = '';
    })
    document.querySelector(".extended-view-buttons").style.display = 'none';
}

function changeFont(flag) {
    const output = document.getElementById("output");
    const currentSize = window.getComputedStyle(output, null).getPropertyValue('font-size');
    output.style.fontSize = (flag) ? parseFloat(currentSize) + 0.5 + "px": parseFloat(currentSize) - 0.5 + "px";
}

const colors = [
  "#8cffc1",
  "#ffffff",
  "#c7b7ff",
  "#ffd479",
  "#ff9fbf",
  "#ff9f7f",
  "#b8c7c1"
];
let colorIndex = 0;

function changeColor(){
  const output = document.getElementById("output");
  colorIndex = (colorIndex + 1) % colors.length;
  output.style.color = colors[colorIndex];
}
</script>

<script src = "index.js"></script>
</body>
</html>
